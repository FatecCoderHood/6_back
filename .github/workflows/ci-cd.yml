name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Testes Unitários Java
  test-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Run Java Unit Tests
        run: |
          cd enersight-api
          ./mvnw test
          
      - name: Upload Test Reports
        uses: actions/upload-artifact@v3
        with:
          name: java-test-reports
          path: enersight-api/target/surefire-reports/

  # Job 2: Testes Python
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          cd enersight-temporal-series
          pip install -r requirements.txt
          pip install -r requirements_api.txt
          pip install pytest pytest-cov
          
      - name: Run Python tests
        run: |
          cd enersight-temporal-series
          pytest app/tests/ -v --cov=app --cov-report=xml
          
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./enersight-temporal-series/coverage.xml

  # Job 3: Build e Push Docker Images
  build-and-push:
    needs: [test-java, test-python]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          
      - name: Build and push Java API
        run: |
          cd enersight-api
          docker build -t seuuser/enersight-api:latest .
          docker push seuuser/enersight-api:latest
          
      - name: Build and push Temporal Series API
        run: |
          cd enersight-temporal-series
          docker build -f Dockerfile.api -t seuuser/enersight-temporal-api:latest .
          docker push seuuser/enersight-temporal-api:latest
          
      - name: Build and push Worker
        run: |
          cd enersight-worker
          docker build -t seuuser/enersight-worker:latest .
          docker push seuuser/enersight-worker:latest

  # Job 4: Deploy para Servidor Local
  deploy-local:
    needs: build-and-push
    runs-on: self-hosted  # Precisa de um runner self-hosted no seu servidor Linux
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy with Docker Compose
        run: |
          cd /opt/enersight
          docker-compose pull
          docker-compose down
          docker-compose up -d
          docker system prune -f