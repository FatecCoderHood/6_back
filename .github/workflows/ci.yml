name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, release]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: enersight-api (test, coverage, sonar)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enersight-api
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar needs full history for accurate new-code detection

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Testcontainers starts PostGIS itself; Docker is available on ubuntu-latest.
      - name: Test and coverage
        run: mvn -B verify

      # Skipped when the token is absent (for example, pull requests from forks).
      - name: SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_API }}

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: enersight-api/target/surefire-reports
