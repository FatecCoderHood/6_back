
name: Deploy EnerSight Backend

on:
  push:
    branches:
      - release

permissions:
  contents: read

concurrency:
  group: deploy-enersight
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test API
        working-directory: enersight-api
        run: mvn -B clean verify

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: 100.64.54.69

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H 100.64.54.69 >> ~/.ssh/known_hosts

      - name: Upload JAR to EC2
        run: |
          JAR=$(find enersight-api/target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' | head -n 1)
          test -n "$JAR"
          scp -i ~/.ssh/ec2_key "$JAR" ubuntu@100.64.54.69:/home/ubuntu/app.jar

      - name: Restart EnerSight
        run: |
          ssh -i ~/.ssh/ec2_key ubuntu@100.64.54.69 \
            "sudo install -o ubuntu -g ubuntu -m 0644 /home/ubuntu/app.jar /opt/enersight/app.jar && \
             rm /home/ubuntu/app.jar && \
             sudo systemctl restart enersight && \
             sudo systemctl is-active --quiet enersight"
