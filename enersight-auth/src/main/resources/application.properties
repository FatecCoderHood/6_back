spring.application.name=enersight-auth

# Database connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/enersight_auth}
spring.datasource.username=${DB_USER:auth_user}
spring.datasource.password=${DB_PASSWORD:auth_password}

# Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (HMAC). The default secret below is dev-only — override JWT_SECRET in any non-local environment.
# Must match the secret configured in enersight-api: both services trust the same signing key.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32bytesmin}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}
