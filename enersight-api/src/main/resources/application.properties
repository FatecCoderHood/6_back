spring.application.name=enersight

# Database connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/enersight_app}
spring.datasource.username=app_user
spring.datasource.password=app_password

# Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.user=flyway_user
spring.flyway.password=flyway_password
spring.flyway.locations=classpath:db/migration
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/enersight_app}

# JWT
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjcmV0LWtleS1mb3ItZW5lcnNpZ2h0LWFwcC0yMDI1}
jwt.expiration=86400000