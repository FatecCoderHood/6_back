spring.application.name=enersight

# Database connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/enersight_app}
spring.datasource.username=app_user
spring.datasource.password=app_password

# Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.user=flyway_user
spring.flyway.password=flyway_password
spring.flyway.locations=classpath:db/migration
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/enersight_app}

# JWT (HMAC) — validation only, enersight-api never issues tokens.
# Must match the secret configured in enersight-auth: both services trust the same signing key.
# The default below is dev-only — override JWT_SECRET in any non-local environment.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32bytesmin}
