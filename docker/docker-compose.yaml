services:
  enersight-db:
    image: postgis/postgis:16-3.5-alpine
    container_name: enersight-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - enersight_postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enersight-network
  
  mongo:
    image: mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
  
  enersight-worker:
    build:
      context: ../enersight-worker
      dockerfile: ./Dockerfile
    restart: unless-stopped
    container_name: enersight-worker
    depends_on:
      - enersight-db
    networks:
      - enersight-network
    
  enersight-job-producer:
    build:
      context: ../enersight-worker
    container_name: enersight-job-producer
    command: python -m app.ingestion.job_producer
    depends_on:
      - enersight-db
    networks:
      - enersight-network

volumes:
  enersight_postgres_data:

networks:
  enersight-network:
    driver: bridge