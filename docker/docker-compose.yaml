services:
  enersight-db:
    image: postgis/postgis:16-3.5-alpine
    container_name: enersight-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - enersight_postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enersight-network
  
  enersight-mongo:
    image: mongo:7.0.34-jammy
    container_name: enersight-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - enersight_mongo_data:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - enersight-network

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: root
      ME_CONFIG_BASICAUTH_PASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://root:password@enersight-mongo:27017/?authSource=admin
    depends_on:
      enersight-mongo:
        condition: service_healthy
    networks:
      - enersight-network
  
  enersight-worker:
    build:
      context: ../enersight-worker
      dockerfile: ./Dockerfile
    restart: unless-stopped
    container_name: enersight-worker
    depends_on:
      enersight-db:
        condition: service_healthy
    networks:
      - enersight-network
    
  enersight-job-producer:
    build:
      context: ../enersight-worker
    container_name: enersight-job-producer
    command: python -m app.ingestion.job_producer
    depends_on:
      enersight-db:
        condition: service_healthy
    networks:
      - enersight-network

  enersight-temporal-series:
    build:
      context: ../enersight-temporal-series
      dockerfile: ./Dockerfile
    container_name: enersight-temporal-series
    # Pipeline em lote (roda até concluir). Use `docker compose run --rm
    # enersight-temporal-series` para disparar sob demanda.
    restart: "no"
    environment:
      MONGO_HOST: enersight-mongo
      MONGO_PORT: "27017"
      MONGO_USER: app_user
      MONGO_PASSWORD: app_password
      MONGO_AUTH_DB: enersight_app
      SOURCE_DB: enersight_app
      OUTPUT_DB: enersight_app
    depends_on:
      enersight-mongo:
        condition: service_healthy
    networks:
      - enersight-network

volumes:
  enersight_postgres_data:
  enersight_mongo_data:

networks:
  enersight-network:
    driver: bridge